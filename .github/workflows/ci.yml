name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          missing=0
          for f in README.md RaceDay.sln Dockerfile docker-compose.yml \
                   RaceDay.Api/RaceDay.Api.csproj RaceDay.Api.Tests/RaceDay.Api.Tests.csproj RaceDay.Web/RaceDay.Web.csproj; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          for d in docs RaceDay.Api/Controllers RaceDay.Web/Controllers RaceDay.Web/Views; do
            if [ ! -d "$d" ]; then echo "MISSING FOLDER: $d"; missing=1; fi
          done
          if ! compgen -G "docs/*.sql" > /dev/null; then echo "MISSING: .sql script in docs/"; missing=1; fi
          exit $missing

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build API, tests and MVC project
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Build MVC project (explicit)
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal

      - name: Build Docker image for the MVC application
        run: docker build -t raceday-web .
